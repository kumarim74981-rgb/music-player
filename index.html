<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    <div class="music-player">
        <h1 class="logo">
            ❤️ Music Player
        </h1>
        <div class="player-card">
            <!-- Album Cover -->
            <div class="album">
                <img src="./image1.png" id="cover">
            </div>
            <!-- Song Details -->
            <div class="song-details">
                <h2 id="title">
                    Shape Of You
                </h2>
                <p id="artist">
                    Ed Sheeran
                </p>
            </div>
            <!-- Audio -->
            <audio id="audio"></audio>
            <!-- Progress -->
            <div id="progress-area" class="progress-area">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <!-- Time -->
            <div class="time">
                <span id="current">0:00</span>

                <span id="duration">0:00</span>
            </div>
            <!-- Controls -->
            <div class="controls">
                <button id="prev">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="play">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="next">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>
            <!-- Volume -->
            <div class="volume-box">
                <i class="fa-solid fa-volume-high"></i>
                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">
            </div>
            <hr>
            <h3>🎵 Playlist</h3>
            <ul class="playlist">
                <li onclick="playSong(0)">
                    🎵 Tumse Behtar
                </li>
                <li onclick="playSong(1)">
                    🎵 Itni Si Baat Hai
                </li>
                <li onclick="playSong(2)">
                    🎵 Khat
                </li>
                <li onclick="playSong(3)">
                    🎵 Sittare
                </li>
            </ul>
            <div class="buttons">
                <button id="shuffle" class="shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="repeat" class="repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>
                <button id="favorite" class="favorite">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>
        </div>
    </div>
    <footer class="footer">
        <p>
            🎧 Made with ❤️ by Mishti ❤️
        </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
